[colors]
background = #191724
background-alt = #21202e
text = #e0def4
primary = #ebbcba
secondary = #f6c177
alert = #eb6f92
disabled = #6e6a86

[bar/bar]
height = 40
width = 100%
bottom = false
background = ${colors.background}
separator = "\\"

padding-right = 3

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=12;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=18;5

module-margin = 2
modules-left = workspaces tray
modules-center = time
modules-right = audio-output pulseaudio ethernet 

line-size = 2
line-color = ${colors.primary}

monitor = ${env:MONITOR}

border-top-size = 2
border-top-color = ${colors.secondary}

[module/empty-space]
type = custom/text
content = " "

[module/right-padding]
type = custom/text
content = ""

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = false

format = <label-state>
label-monitor = %name%

label-active = %index%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background-alt}
label-occupied = %index%
label-occupied-foreground = ${colors.text}
label-occupied-background = ${colors.background}
label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.background}
label-empty = %index%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}

label-active-padding = 3
label-urgent-padding = 3
label-occupied-padding = 3
label-empty-padding = 3

[module/ethernet]
type = internal/network
interface = enp42s0
interval = 1.0
format-connected = <label-connected>
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.primary}
label-connected = "%{A}Connected%{A}"
format-disconnected = <label-disconnected>
format-disconnected-prefix = "  "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected = "%{A}Offline%{A}"

[module/time]
type = internal/date
format = <label>
format-prefix-foreground = ${colors.primary}
label = %date%, %time%
date = %a, %d %B %Y
time = %H:%M

[module/pulseaudio]
type = internal/pulseaudio
click-right = pavucontrol

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-muted-foreground = ${colors.alert}

label-muted = 󰖁

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

ramp-volume-0-foreground = ${colors.disabled}
ramp-volume-1-foreground = ${colors.primary}
ramp-volume-2-foreground = ${colors.text}

[module/audio-output]
type = custom/script
exec = ~/.config/polybar/scripts/audio-output-switcher.sh
click-left = ~/.config/polybar/scripts/audio-output-switcher.sh --toggle
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors.primary}
