;==========================================================
;  Batman Beyond - polybar
;  black bg / neon-red accents / JetBrainsMono Nerd Font
;  stats: CPU+NVMe temps, RAM, disk, GPU, live net speeds
;==========================================================

[colors]
background     = #000000
background-alt = #1a1a1a
foreground     = #ffffff
primary        = #ff003c
secondary      = #ff3333
alert          = #ff4d4d
disabled       = #555555
warm           = #ff8c00

[bar/bar]
height         = 40
width          = 100%
bottom         = false
background     = ${colors.background}
foreground     = ${colors.foreground}
separator      =
padding-right  = 2
module-margin  = 1

font-0 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=13;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:pixelsize=14;3"
font-2 = "JetBrainsMono Nerd Font:style=Regular:size=15;4"

modules-left   = launcher workspaces
modules-center = title
modules-center-maxlen = 900
modules-right  = memory cpu temperature gpu filesystem pulseaudio audio-output network-speed time

monitor = ${env:MONITOR:}
wm-restack = i3
override-redirect = false
enable-strut = true

border-top-size = 2
border-top-color = ${colors.primary}

cursor-click = pointer

;==========================================================
; LEFT
;==========================================================

[module/launcher]
type = custom/text
content = 
content-padding = 1
click-left = ~/.config/rofi/launchers/type-7/launcher.sh
tooltip = false

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = false

format = <label-state>

label-active = %index%
label-active-font = 2
label-active-foreground = #000000
label-active-background = ${colors.primary}

label-occupied = %index%
label-occupied-font = 2
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background-alt}

label-urgent = !%index%!
label-urgent-font = 2
label-urgent-foreground = #000000
label-urgent-background = ${colors.alert}

label-empty = %index%
label-empty-font = 2
label-empty-foreground = ${colors.disabled}

label-active-padding   = 2
label-urgent-padding   = 2
label-occupied-padding = 2
label-empty-padding    = 2

;==========================================================
; CENTER
;==========================================================

[module/title]
type = internal/xwindow
format = <label>
format-prefix = 
format-prefix-font = 2
format-prefix-foreground = ${colors.secondary}
label = %title%
label-maxlen = 60
label-ellipsis = true
label-empty = Gotham City

;==========================================================
; RIGHT - system stats
;==========================================================

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = 
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %gb_used%/%gb_total%
click-left = kitty -e btop

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = 
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %percentage%%
click-left = kitty -e btop

[module/temperature]
type = internal/temperature
hwmon-path = ${env:HWMON_PATH:/sys/class/hwmon/hwmon2/temp1_input}
base-temperature = 30
warn-temperature = 80
interval = 3
format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.alert}
label = %temperature-c%
label-warn = %temperature-c%
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 2
ramp-0-foreground = ${colors.foreground}
ramp-1-foreground = ${colors.warm}
ramp-2-foreground = ${colors.alert}

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 5
format = <label>

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted = <label-mounted>
format-unmounted = <label-unmounted>
format-mounted-prefix = 
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %free%
label-unmounted = %mountpoint%: not mounted

;==========================================================
; Audio
;==========================================================

[module/pulseaudio]
type = internal/pulseaudio
sink = @DEFAULT_SINK@
interval = 5
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-font = 2
format-muted-foreground = ${colors.disabled}
label-volume = %percentage%%
label-muted = muted
click-right = kitty -e pulsemixer
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +2%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -2%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-font = 2
ramp-volume-0-foreground = ${colors.disabled}
ramp-volume-1-foreground = ${colors.foreground}
ramp-volume-2-foreground = ${colors.primary}

[module/audio-output]
type = custom/script
exec = ~/.config/polybar/scripts/audio-output-switcher.sh
click-left = ~/.config/polybar/scripts/audio-output-switcher.sh --toggle
interval = 2
format = <label>

;==========================================================
; Network - link state + live up/down speed
;==========================================================

[module/network-speed]
type = custom/script
exec = ~/.config/polybar/scripts/net-speed.sh enp42s0
tail = true
interval = 1
format = <label>

;==========================================================
; Clock
;==========================================================

[module/time]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
format = <label>
format-prefix = 
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %date%  %time%
